name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: reqtrace run --mock --out out
      - run: python evals/run_eval.py --mock   # exits non-zero if recall < 5/5 or false positives > 0
