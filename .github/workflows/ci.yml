name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:   # the release workflow reuses this job as its gate
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - uses: ./.github/actions/eval-gate      # reqtrace run --mock, then the scorer: exits non-zero if recall < 5/5 or false positives > 0
